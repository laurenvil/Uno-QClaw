<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 340" width="320" height="340">
  <defs>

    <!-- Background radial: deep navy core to near-black edge -->
    <radialGradient id="bgGrad" cx="50%" cy="44%" r="56%">
      <stop offset="0%"   stop-color="#12103a"/>
      <stop offset="100%" stop-color="#07061c"/>
    </radialGradient>

    <!-- Skin: warm amber gradient with subtle highlight -->
    <radialGradient id="skinGrad" cx="38%" cy="32%" r="62%">
      <stop offset="0%"   stop-color="#f0d4a0"/>
      <stop offset="100%" stop-color="#c8914e"/>
    </radialGradient>

    <!-- Robe: deep indigo -->
    <linearGradient id="robeGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%"   stop-color="#2d2a72"/>
      <stop offset="100%" stop-color="#1a1848"/>
    </linearGradient>

    <!-- Sash: teal (Arduino brand) -->
    <linearGradient id="sashGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00979d" stop-opacity="0.2"/>
      <stop offset="30%"  stop-color="#00979d"/>
      <stop offset="70%"  stop-color="#00b4bd"/>
      <stop offset="100%" stop-color="#00979d" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Outer ring glow -->
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="80%"  stop-color="#00979d" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00979d" stop-opacity="0.35"/>
    </radialGradient>

    <!-- Circuit trace glow -->
    <filter id="traceGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Figure drop shadow -->
    <filter id="figShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <!-- Soft glow for head / hands -->
    <filter id="skinGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Clip to circle -->
    <clipPath id="circleClip">
      <circle cx="160" cy="148" r="130"/>
    </clipPath>

  </defs>

  <!-- ── BACKGROUND ── -->
  <circle cx="160" cy="148" r="138" fill="url(#ringGlow)"/>
  <circle cx="160" cy="148" r="132" fill="#07061c"/>
  <circle cx="160" cy="148" r="130" fill="url(#bgGrad)"/>

  <!-- ── PCB TRACE PATTERN (clipped to circle) ── -->
  <g clip-path="url(#circleClip)" opacity="0.18" stroke="#00979d" stroke-width="0.8"
     fill="none" filter="url(#traceGlow)">

    <!-- Horizontal traces -->
    <line x1="34"  y1="80"  x2="100" y2="80"/>
    <line x1="34"  y1="88"  x2="78"  y2="88"/>
    <line x1="220" y1="80"  x2="286" y2="80"/>
    <line x1="240" y1="88"  x2="286" y2="88"/>
    <line x1="34"  y1="200" x2="82"  y2="200"/>
    <line x1="238" y1="200" x2="286" y2="200"/>
    <line x1="34"  y1="210" x2="66"  y2="210"/>
    <line x1="252" y1="210" x2="286" y2="210"/>

    <!-- Vertical traces -->
    <line x1="48"  y1="80"  x2="48"  y2="110"/>
    <line x1="58"  y1="88"  x2="58"  y2="110"/>
    <line x1="272" y1="80"  x2="272" y2="110"/>
    <line x1="262" y1="88"  x2="262" y2="110"/>
    <line x1="48"  y1="200" x2="48"  y2="178"/>
    <line x1="272" y1="200" x2="272" y2="178"/>

    <!-- Vias (pads) -->
    <circle cx="48"  cy="80"  r="3.5"/>
    <circle cx="272" cy="80"  r="3.5"/>
    <circle cx="58"  cy="88"  r="2.5"/>
    <circle cx="262" cy="88"  r="2.5"/>
    <circle cx="48"  cy="200" r="3.5"/>
    <circle cx="272" cy="200" r="3.5"/>

    <!-- Corner L-traces bottom -->
    <path d="M 56 220 L 56 235 L 90 235"/>
    <path d="M 264 220 L 264 235 L 230 235"/>
    <circle cx="56"  cy="235" r="2.5"/>
    <circle cx="264" cy="235" r="2.5"/>

    <!-- Sparse cross-hatch lines far left/right -->
    <line x1="34"  y1="130" x2="60"  y2="130" opacity="0.6"/>
    <line x1="260" y1="130" x2="286" y2="130" opacity="0.6"/>
    <line x1="34"  y1="165" x2="56"  y2="165" opacity="0.6"/>
    <line x1="264" y1="165" x2="286" y2="165" opacity="0.6"/>
  </g>

  <!-- ── RING BORDERS ── -->
  <circle cx="160" cy="148" r="130" fill="none" stroke="#00979d" stroke-width="1.2" opacity="0.55"/>
  <circle cx="160" cy="148" r="125" fill="none" stroke="#2d2a72" stroke-width="0.6" opacity="0.7"/>

  <!-- ── MONK FIGURE ── -->

  <!-- Ground shadow -->
  <ellipse cx="160" cy="232" rx="66" ry="10" fill="#000" opacity="0.35"/>

  <!-- Robe / seated body — wide flowing form -->
  <path d="M 102 134 Q 160 122 218 134 L 224 228 Q 160 218 96 228 Z"
        fill="url(#robeGrad)" filter="url(#figShadow)"/>

  <!-- Left lapel -->
  <path d="M 160 126 L 128 144 L 118 226 L 160 214 Z"
        fill="#1e1c5a" opacity="0.9"/>

  <!-- Right lapel -->
  <path d="M 160 126 L 192 144 L 202 226 L 160 214 Z"
        fill="#1e1c5a" opacity="0.8"/>

  <!-- Robe fold lines -->
  <path d="M 152 152 L 144 220" stroke="#252268" stroke-width="0.8" fill="none" opacity="0.6"/>
  <path d="M 168 152 L 176 220" stroke="#252268" stroke-width="0.8" fill="none" opacity="0.6"/>

  <!-- Sash / belt — teal Arduino accent -->
  <path d="M 100 174 Q 160 164 220 174 L 218 184 Q 160 174 102 184 Z"
        fill="url(#sashGrad)"/>
  <!-- Sash highlight -->
  <path d="M 110 174 Q 160 167 210 174 L 209 177 Q 160 170 111 177 Z"
        fill="#fff" opacity="0.08"/>

  <!-- Folded hands (dhyana mudra) in lap -->
  <ellipse cx="160" cy="212" rx="30" ry="13" fill="url(#skinGrad)" opacity="0.97"
           filter="url(#skinGlow)"/>
  <!-- Finger suggestion -->
  <path d="M 136 212 Q 160 207 184 212" stroke="#b07848" stroke-width="1"
        fill="none" opacity="0.45"/>
  <path d="M 140 215 Q 160 211 180 215" stroke="#b07848" stroke-width="0.7"
        fill="none" opacity="0.3"/>

  <!-- Neck -->
  <rect x="150" y="114" width="20" height="16" rx="5" fill="url(#skinGrad)"/>

  <!-- Head — round, serene, slightly bowed -->
  <ellipse cx="160" cy="88" rx="36" ry="38" fill="url(#skinGrad)"
           filter="url(#skinGlow)"/>

  <!-- Head highlight — catches light top-left -->
  <ellipse cx="149" cy="72" rx="13" ry="10" fill="#f8e8c0" opacity="0.22"/>

  <!-- Ears with lobes -->
  <ellipse cx="124" cy="91" rx="6"   ry="9"   fill="#c89050"/>
  <ellipse cx="196" cy="91" rx="6"   ry="9"   fill="#c89050"/>
  <ellipse cx="124" cy="91" rx="3.5" ry="5.5" fill="#b07840" opacity="0.45"/>
  <ellipse cx="196" cy="91" rx="3.5" ry="5.5" fill="#b07840" opacity="0.45"/>
  <!-- Extended earlobes (wisdom symbol) -->
  <ellipse cx="124" cy="99" rx="4"   ry="3.5" fill="#c89050"/>
  <ellipse cx="196" cy="99" rx="4"   ry="3.5" fill="#c89050"/>

  <!-- Eyebrows — gentle, lifted slightly in calm awareness -->
  <path d="M 142 72 Q 150 68 158 70" stroke="#7a5020" stroke-width="1.8"
        fill="none" stroke-linecap="round"/>
  <path d="M 162 70 Q 170 68 178 72" stroke="#7a5020" stroke-width="1.8"
        fill="none" stroke-linecap="round"/>

  <!-- Eyes — closed, curved downward in deep meditation -->
  <path d="M 143 81 Q 151 77 159 81" stroke="#4a2a0a" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <path d="M 161 81 Q 169 77 177 81" stroke="#4a2a0a" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>

  <!-- Lower lash / depth shadow -->
  <path d="M 143 82 Q 151 85 159 82" stroke="#c09060" stroke-width="1"
        fill="none" stroke-linecap="round" opacity="0.35"/>
  <path d="M 161 82 Q 169 85 177 82" stroke="#c09060" stroke-width="1"
        fill="none" stroke-linecap="round" opacity="0.35"/>

  <!-- Nose — minimal hint -->
  <path d="M 157 91 Q 160 97 163 91" stroke="#b07848" stroke-width="1.2"
        fill="none" stroke-linecap="round" opacity="0.45"/>

  <!-- Serene smile — subtle, warm -->
  <path d="M 149 101 Q 160 108 171 101" stroke="#8B4a28" stroke-width="1.8"
        fill="none" stroke-linecap="round"/>

  <!-- ── WORDMARK ── -->

  <!-- Teal divider line with center ornament -->
  <line x1="64"  y1="267" x2="143" y2="267" stroke="#00979d" stroke-width="0.8" opacity="0.6"/>
  <circle cx="160" cy="267" r="2.5" fill="#00979d" opacity="0.7"/>
  <line x1="177" y1="267" x2="256" y2="267" stroke="#00979d" stroke-width="0.8" opacity="0.6"/>

  <!-- "QCLAW" — geometric serif, lavender-white -->
  <text x="160" y="293"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="28"
        font-weight="bold"
        letter-spacing="10"
        fill="#e8e4ff">QCLAW</text>

  <!-- Tagline — monospace, teal, spaced -->
  <text x="160" y="313"
        text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="7.5"
        letter-spacing="3.5"
        fill="#00979d"
        opacity="0.85">ARDUINO AI ASSISTANT</text>

</svg>
