services:
  # ─────────────────────────────────────────────
  # qclaw Agent (one-shot query) - Full MCP Support
  #   docker compose -f docker/docker-compose.full.yml run --rm qclaw-agent -m "Hello"
  # ─────────────────────────────────────────────
  qclaw-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.full
    container_name: qclaw-agent-full
    profiles:
      - agent
    volumes:
      - ../config/config.json:/root/.qclaw/config.json:ro
      - qclaw-workspace:/root/.qclaw/workspace
      - qclaw-npm-cache:/root/.npm # npm cache for faster MCP server installs
    entrypoint: ["qclaw", "agent"]
    stdin_open: true
    tty: true

  # ─────────────────────────────────────────────
  # qclaw Gateway (Long-running Bot) - Full MCP Support
  #   docker compose -f docker/docker-compose.full.yml --profile gateway up
  # ─────────────────────────────────────────────
  qclaw-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.full
    container_name: qclaw-gateway-full
    restart: unless-stopped
    profiles:
      - gateway
    volumes:
      # Configuration file
      - ../config/config.json:/root/.qclaw/config.json:ro
      # Persistent workspace (sessions, memory, logs)
      - qclaw-workspace:/root/.qclaw/workspace
      # NPM cache for faster MCP server installs
      - qclaw-npm-cache:/root/.npm
    command: ["gateway"]

volumes:
  qclaw-workspace:
  qclaw-npm-cache: # Cache npm packages to speed up MCP server installations
