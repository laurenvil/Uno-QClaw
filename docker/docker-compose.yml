services:
  # ─────────────────────────────────────────────
  # qclaw Agent (one-shot query)
  #   docker compose -f docker/docker-compose.yml run --rm qclaw-agent -m "Hello"
  # ─────────────────────────────────────────────
  qclaw-agent:
    image: docker.io/laurenvil/qclaw:latest
    container_name: qclaw-agent
    profiles:
      - agent
    # Uncomment to access host network; leave commented unless needed.
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/root/.qclaw
    entrypoint: ["qclaw", "agent"]
    stdin_open: true
    tty: true

  # ─────────────────────────────────────────────
  # qclaw Gateway (Long-running Bot)
  #   docker compose -f docker/docker-compose.yml --profile gateway up
  # ─────────────────────────────────────────────
  qclaw-gateway:
    image: docker.io/laurenvil/qclaw:latest
    container_name: qclaw-gateway
    restart: on-failure
    profiles:
      - gateway
    # Uncomment to access host network; leave commented unless needed.
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/root/.qclaw

  # ─────────────────────────────────────────────
  # qclaw Launcher (Web Console + Gateway)
  #   docker compose -f docker/docker-compose.yml --profile launcher up
  # ─────────────────────────────────────────────
  qclaw-launcher:
    image: docker.io/laurenvil/qclaw:launcher
    container_name: qclaw-launcher
    restart: on-failure
    profiles:
      - launcher
    environment:
      - QCLAW_GATEWAY_HOST=0.0.0.0
    ports:
      - "127.0.0.1:18800:18800"
      - "127.0.0.1:18790:18790"
    volumes:
      - ./data:/root/.qclaw
